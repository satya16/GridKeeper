name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hub-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hub/frontend/package-lock.json

      # app/main.py mounts app/static/dist/ at import time (StaticFiles
      # raises if the directory doesn't exist), and that directory is
      # build output, not checked in -- so hub/tests/conftest.py can't
      # even import the app without this.
      - name: Build dashboard frontend
        run: |
          cd hub/frontend
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hub test dependencies
        run: pip install -r hub/requirements-dev.txt

      - name: Run hub tests
        run: |
          cd hub
          pytest tests/ -v

  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install node test dependencies
        run: pip install -r node/requirements-dev.txt

      - name: Run node tests
        run: |
          cd node
          pytest tests/ -v

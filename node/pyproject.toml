[project]
name = "grid-node"
version = "0.1.0"
description = "GridKeeper node -- controls local BOINC/Folding@home clients and reports status to GridKeeper"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "zeroconf>=0.132",
    "psutil>=5.9",
]

[project.scripts]
grid-node = "grid_node.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["grid_node*"]
